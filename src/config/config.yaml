paths:
  bd_path: "src/storage/metadados/documents.json"
  export_path: "src/storage/exports/documents.csv"
  files_path: "src/storage/files"
  log_path: "src/storage/logs/sistema.log"

settings:
  chunk_size: 1048576
  timestamp_format: "%Y%m%d%H%M%S"
  upload_date_format: "%Y-%m-%d %H-%M-%S"
  max_upload_size: 10485760

logging:
  version: 1

  formatters:
    detailed:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: detailed
      stream: ext://sys.stdout

    file:
      class: logging.FileHandler
      level: DEBUG
      formatter: detailed
      filename: sistema.log
      encoding: utf-8

  loggers:
    cofre_digital:
      level: DEBUG
      handlers:
        - console
        - file
      propagate: false

  root:
    level: WARNING
    handlers:
      - console

  